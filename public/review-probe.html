<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temporary acceptance checks</title>
<style>body{font:16px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem;color:#202631}button{display:block;margin:.6rem 0;padding:.65rem 1rem}pre{white-space:pre-wrap;background:#f2f4f7;padding:1rem}</style>
<h1>Temporary acceptance checks</h1>
<p>Fixed fictional test requests only. This page shows response codes, short status messages, record counts and calculated totals. It never displays account IDs, private chat IDs, tokens, or raw record payloads.</p>
<button data-check="denied-sale">Check Kevin cannot submit a sale (expected 403)</button>
<button data-check="denied-approval">Check Richard cannot approve S05 (expected 403)</button>
<button data-check="invalid-split">Check 60/30/20 sale split is rejected (expected 400)</button>
<button data-check="missing-expense">Check missing expense amount is rejected (expected 400)</button>
<button data-check="zero-expense">Check zero expense amount is rejected (expected 400)</button>
<button data-check="duplicate-reference">Check duplicate sale reference is rejected (expected 409)</button>
<button data-check="idempotent-sale">Repeat S03 approval with a conflicting split</button>
<button data-check="idempotent-expense">Repeat E04 allocation with a conflicting destination</button>
<pre id="output" aria-live="polite">Ready.</pre>
<script>
const output = document.querySelector('#output');
async function post(path, body) {
  const response = await fetch('/api' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  let data = {}; try { data = await response.json(); } catch {}
  return { status: response.status, data };
}
async function snapshot() {
  const response = await fetch('/api/state?role=svetlana', { cache: 'no-store' });
  if (!response.ok) throw Error(`State request HTTP ${response.status}`);
  const data = await response.json();
  return { sales: data.sales.length, expenses: data.expenses.length, deliveries: data.deliveries.length, totals: data.totals };
}
function summary(name, response) {
  const d = response.data;
  return { name, http: response.status, message: d.error || d.row?.reference || (d.repeated ? 'repeat ignored' : 'request completed'), repeated: d.repeated ?? undefined, finalSplit: d.row?.final_split ?? undefined, finalAllocation: d.row?.final_allocation ?? undefined };
}
const cases = {
  'denied-sale': ['Kevin sale denied', '/sales', { role:'kevin', reference:'FG26-DENIED-SALE', customer:'Fictional check', project:'A', description:'Must not be recorded', amount:'1.00', split:{richard:100,anastasia:0,jean_claude:0} }],
  'denied-approval': ['Richard approval denied', '/sales/approve', { role:'richard', reference:'S05', split:{richard:100,anastasia:0,jean_claude:0} }],
  'invalid-split': ['60/30/20 rejected', '/sales', { role:'richard', reference:'FG26-BAD-SPLIT', customer:'Fictional check', project:'A', description:'Must not be recorded', amount:'1.00', split:{richard:60,anastasia:30,jean_claude:20} }],
  'missing-expense': ['Missing expense amount rejected', '/expenses', { role:'kevin', reference:'FG26-MISSING-AMOUNT', description:'Must not be recorded', amount:'', category:'Materials', allocation:'A' }],
  'zero-expense': ['Zero expense amount rejected', '/expenses', { role:'kevin', reference:'FG26-ZERO-AMOUNT', description:'Must not be recorded', amount:'0', category:'Materials', allocation:'A' }],
  'duplicate-reference': ['Duplicate S03 reference rejected', '/sales', { role:'richard', reference:'S03', customer:'Duplicate probe', project:'A', description:'Must not be recorded', amount:'1.00', split:{richard:100,anastasia:0,jean_claude:0} }],
  'idempotent-sale': ['Repeated S03 decision', '/sales/approve', { role:'svetlana', reference:'S03', split:{richard:0,anastasia:0,jean_claude:100} }],
  'idempotent-expense': ['Repeated E04 allocation', '/expenses/allocate', { role:'svetlana', reference:'E04', allocation:'A' }]
};
document.querySelectorAll('button').forEach(button => button.addEventListener('click', async () => {
  button.disabled = true;
  try {
    const before = await snapshot();
    const [name, path, body] = cases[button.dataset.check];
    const response = await post(path, body);
    const after = await snapshot();
    output.textContent = JSON.stringify({ request:summary(name,response), before, after, unchanged:JSON.stringify(before)===JSON.stringify(after) }, null, 2);
  } catch (error) { output.textContent = `Check failed: ${error.message}`; }
  finally { button.disabled = false; }
}));
</script>
</html>
