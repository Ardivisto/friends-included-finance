<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Temporary authorization checks</title>
<main>
  <h1>Temporary authorization checks</h1>
  <p>Fictional requests for live server authorization testing. Both must be rejected without changing records.</p>
  <button id="kevin-sale">Test Kevin submitting a sale</button>
  <button id="richard-approval">Test Richard approving a sale</button>
  <pre id="result" aria-live="polite"></pre>
</main>
<script>
const result = document.querySelector('#result');
async function run(path, body) {
  const response = await fetch(`/api${path}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const data = await response.json();
  result.textContent = `HTTP ${response.status}\n${JSON.stringify(data, null, 2)}`;
}
document.querySelector('#kevin-sale').addEventListener('click', () => run('/sales', {
  role: 'kevin', reference: 'FG06-DENIED-SALE-01', customer: 'Fictional denied customer',
  project: 'A', description: 'Authorization test only', amount: '100',
  split: { richard: 50, anastasia: 30, jean_claude: 20 }
}));
document.querySelector('#richard-approval').addEventListener('click', () => run('/sales/approve', {
  role: 'richard', reference: 'FG10-MISSING-LIVE-01',
  split: { richard: 50, anastasia: 30, jean_claude: 20 }
}));
</script>
